name: Release

# Releases are cut by pushing a tag:
#
#   git tag v1.6.0 && git push origin v1.6.0
#
# The tag is the version. This workflow only reads the repository — it never
# commits, bumps, or pushes anything back.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # Runs before anything is pushed, so a tag without release notes fails
      # the job while it is still a no-op.
      - name: Build release body from CHANGELOG
        run: |
          bash .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > release-body.md
          {
            echo
            echo '---'
            echo
            echo '### Docker'
            echo
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME#v}"
            echo '```'
          } >> release-body.md
          cat release-body.md

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        env:
          # Stamp OCI annotations onto the image index (manifest list) so the
          # description/source show up on the GHCR package page for the
          # multi-arch image — without this they only attach to child manifests.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          token: ${{ secrets.GITHUB_TOKEN }}
