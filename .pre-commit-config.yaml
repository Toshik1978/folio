# Plain `pre-commit install` only wires the pre-commit stage, which would leave
# the conventional-commit check below dormant. Declaring both hook types here
# means every contributor gets commit-msg enforcement from the same one command.
default_install_hook_types: [pre-commit, commit-msg]

repos:
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
    - id: conventional-pre-commit
      stages:
        - commit-msg

- repo: local
  hooks:
    - id: linters
      name: Run linters
      types_or: [go, javascript, jsx, ts, tsx, vue, html]
      pass_filenames: false
      language: system
      entry: task lint
      stages:
        - pre-commit

    - id: tests
      name: Run tests
      types_or: [go, javascript, jsx, ts, tsx, vue, html]
      pass_filenames: false
      language: system
      entry: task test
      stages:
        - pre-commit
