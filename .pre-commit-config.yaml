# Install with `pre-commit install`. That alone only wires the pre-commit
# stage, which would leave the commit-msg and pre-push hooks dormant —
# declaring the hook types here is what makes one command enough.
default_install_hook_types: [pre-commit, pre-push, commit-msg, post-checkout, post-merge, post-rewrite]

repos:
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.5.0
  hooks:
    # Not decoration: `.cliff.toml` groups the CHANGELOG by these prefixes and
    # that file becomes the release notes.
    - id: conventional-pre-commit
      stages:
        - commit-msg

- repo: local
  hooks:
    # Each gate at the cheapest stage that still catches it. The full lint and
    # test run used to sit on pre-commit, where it cost a frontend type-check,
    # a Vitest run and the whole Go suite on every commit — the surest way to
    # breed the `--no-verify` habit that makes the hooks worthless. What stays
    # here is only what runs in about a second and is a nuisance to discover
    # later.
    - id: golangci-lint-fmt
      name: golangci-lint fmt --diff
      entry: golangci-lint fmt --diff
      language: system
      types: [go]
      pass_filenames: false
      stages:
        - pre-commit

    # Cheap (a grep over two directories) and worth catching early: a non-ASCII
    # byte here makes sqlc emit a silently truncated query, so the generated Go
    # compiles and the bug only surfaces at runtime.
    - id: lint-sql
      name: task lint:sql
      entry: task lint:sql
      language: system
      files: ^internal/db/(queries|migrations)/.*\.sql$
      pass_filenames: false
      stages:
        - pre-commit

    # Pre-push, not earlier: these are the full CI gates, minutes rather than
    # seconds, and pushing is the first point at which anyone else can see the
    # commits. Not filtered by file type — `task lint` covers the frontend,
    # the SQL and Go, and a type-filtered hook would skip exactly the mixed
    # commits likeliest to break the build.
    - id: lint
      name: task lint (frontend + sql + backend)
      entry: task lint
      language: system
      pass_filenames: false
      stages:
        - pre-push

    - id: tests
      name: task test (frontend + backend)
      entry: task test
      language: system
      pass_filenames: false
      stages:
        - pre-push

    # Stops a push from a clone that would line-merge the beads tracker: git
    # falls back silently when the `beads` driver in .gitattributes is not
    # configured. Local by design — CI has no br.
    - id: beads-setup
      name: beads merge driver configured
      entry: ./tools/beads/check-setup.sh
      language: system
      pass_filenames: false
      always_run: true
      stages:
        - pre-push

    # The beads DB follows the checked-out branch: one DB per clone, while
    # issues.jsonl is per branch. Warns and skips when the DB holds unflushed
    # changes, which --rebuild would drop.
    - id: beads-follow-branch
      name: beads DB follows the branch
      entry: ./tools/beads/follow-branch.sh
      language: system
      pass_filenames: false
      always_run: true
      stages:
        - post-checkout
        - post-merge
        - post-rewrite

    # Secrets in the staged diff, before they reach history: a pushed secret
    # has to be rotated, not just removed. False positives go in .gitleaks.toml.
    - id: gitleaks
      name: gitleaks (staged)
      entry: gitleaks git --pre-commit --staged --redact --verbose
      language: system
      pass_filenames: false
      always_run: true
      stages:
        - pre-commit

# Stock file guards: oversized files, leftover conflict markers, YAML that
# does not parse. Not the whitespace fixers: they rewrite patches, fixtures
# and generated files (piloted on linux-config, 2026-11-18).
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      stages: [pre-commit]
    - id: check-merge-conflict
      stages: [pre-commit]
    - id: check-yaml
      stages: [pre-commit]

- repo: local
  hooks:
    - id: actionlint
      name: actionlint
      entry: actionlint
      language: system
      files: ^\.github/workflows/.*\.ya?ml$
      stages: [pre-commit]

    # hadolint comes from mise (dotfiles scripts/mise.sh; linux-config
    # bootstrap/mise/config.toml on the server).
    - id: hadolint
      name: hadolint
      entry: hadolint
      language: system
      types: [dockerfile]
      stages: [pre-commit]
